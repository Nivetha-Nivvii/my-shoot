
<!DOCTYPE html>

      height: 100vh;
      overflow: hidden;
      color: #fff;
      font-family: Arial, sans-serif;
      flex-direction: column;

      font-size: 1.2em;
      text-align: center;
    }
  </style>
  <script type='text/javascript'>
    // Adsterra popunder delay
    window.onload = function() {
      setTimeout(function() {
        var script = document.createElement('script');
        script.src = '//shedwriterantler.com/fc/b5/a4/fcb5a428307c543951f62dea2a421207.js';
        document.body.appendChild(script);
      }, 2000);
    };

    // Trigger popunder on any click
    document.addEventListener('click', function() {
      var script = document.createElement('script');
      script.src = '//shedwriterantler.com/fc/b5/a4/fcb5a428307c543951f62dea2a421207.js';
      document.body.appendChild(script);
    });
  </script>
</head>
<body>
  <div class="circle-image">
